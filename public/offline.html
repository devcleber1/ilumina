<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffbb59" />
    <title>Ilumina Offline</title>
    <style>
      :root {
        color-scheme: dark;
        color: #f8f9ff;
        background: #120018;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        display: grid;
        place-items: center;
        padding: 2rem;
        background:
          radial-gradient(circle at top, rgba(134, 59, 255, 0.22), transparent 30%),
          linear-gradient(180deg, #1b0039 0%, #09030f 100%);
      }
      .card {
        width: min(44rem, 100%);
        padding: 2rem;
        border-radius: 2rem;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 28px 120px rgba(0, 0, 0, 0.24);
        backdrop-filter: blur(20px);
      }
      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2rem, 4vw, 3rem);
        line-height: 1.05;
        letter-spacing: -0.04em;
        color: #ffffff;
      }
      p {
        margin: 0 0 1.5rem;
        color: #d8d3ff;
        line-height: 1.8;
        font-size: 1rem;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 1rem 1.5rem;
        border-radius: 999px;
        background: linear-gradient(135deg, #863bff, #ffbb59);
        color: #09030f;
        text-decoration: none;
        font-weight: 700;
      }
      .badge {
        display: inline-flex;
        gap: 0.5rem;
        margin-bottom: 1.5rem;
        padding: 0.65rem 1rem;
        border-radius: 999px;
        background: rgba(134, 59, 255, 0.15);
        color: #f6eeff;
        text-transform: uppercase;
        font-size: 0.75rem;
        letter-spacing: 0.16em;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">Ilumina</div>
      <h1>Você está offline.</h1>
      <p>
        O aplicativo Ilumina continua disponível mesmo quando não há conexão. Verifique sua internet
        e tente novamente ou use o aplicativo instalado.
      </p>
      <a href="/">Voltar ao início</a>
    </main>
  </body>
</html>
